name: Tests

# Runs the full test suite (tests/run-all.cjs) automatically on every push
# and pull request — so a regression is caught here, before it ever
# reaches Vercel, rather than being caught (or missed) after deploy.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Match package.json and the existing production Vercel runtime.
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
