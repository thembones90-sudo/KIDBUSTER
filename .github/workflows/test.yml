name: Tests

# Match the production runtime and install the exact committed dependency tree.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Select runner Chrome
        shell: bash
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable)
          test -n "$chrome"
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run test suite
        run: npm test
