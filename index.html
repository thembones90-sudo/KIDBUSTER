<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathfinder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400&family=JetBrains+Mono:wght@400;600;700&display=swap');

:root{
  --bg:#0A0A0B;
  --surface:#161617;
  --surface-2:#1E1F21;
  --border:#2B2C2F;
  --border-strong:#3E4045;
  --text:#ECEDEF;
  --text-dim:#9A9CA1;
  --text-faint:#5B5D62;
  --accent:#C7CBD1;
  --accent-dim:rgba(199,203,209,0.14);
  --warm:#F2A65A;
  --warm-dim:rgba(242,166,90,0.14);
  --danger:#E5484D;
  --danger-dim:rgba(229,72,77,0.12);
  --toxin-rgb:159,224,0;
  --toxin:#9FE000;
  --toxin-dim:rgba(var(--toxin-rgb),0.14);
  --toxin-border:rgba(var(--toxin-rgb),0.28);
  --toxin-glow:rgba(var(--toxin-rgb),0.18);
  --olive:#3A4014;
  --toxin-bright:#D4FF5C;
  --toxin-shadow-rgb:200,230,60;
  --toxin-shadow2-rgb:120,200,40;
  --toxin-focus-rgb:190,255,60;
  --toxin-wave-rgb:212,255,92;
  --toxin-label:#C9E894;
  --radius:10px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
/* Ice-blue palette for OF protocol — overrides the same variable names the
   acid-green (MA) theme uses, so every consumer (panels, badge, focus
   states, background glow, status dot, generate button, section-title
   words) re-themes itself automatically without needing protocol-specific
   rules at each usage site.
   Deliberately does NOT touch the Performance Rating buttons — those have
   their own dedicated color functions (ratingColor / ofTierColor) and are
   excluded from this reskin by design. Also does not touch the KIDBUSTER
   brand-name gradient (permanent identity, not part of this theme) or the
   generic lint-ok success-green indicator (a universal pass/fail
   convention, not a branded color). */
body.protocol-of{
  --toxin-rgb:100,210,255;
  --toxin:#64D2FF;
  --olive:#123244;
  --toxin-bright:#DFF8FF;
  --toxin-shadow-rgb:90,195,235;
  --toxin-shadow2-rgb:40,150,195;
  --toxin-focus-rgb:140,225,255;
  --toxin-wave-rgb:205,245,255;
  --toxin-label:#BFEFFF;
  --toxin-dim:rgba(100,210,255,0.14);
  --toxin-border:rgba(100,210,255,0.28);
  --toxin-glow:rgba(100,210,255,0.18);
}
/* Sweet Protocol: same MA engine, soft pink theme so it's
   immediately, visually distinct from standard MA at a glance. Kept
   entirely light (no dark corner) rather than mirroring the acid/ice
   dark-to-bright gradient shape — verified via real contrast math that
   an all-light gradient reads better with the button's dark text than
   forcing a dark corner just for visual parity with the other themes. */
body.protocol-ms{
  --toxin-rgb:255,158,192;
  --toxin:#FF9EC0;
  --olive:#4A1030;
  --toxin-bright:#FFF0F5;
  --toxin-shadow-rgb:255,120,160;
  --toxin-shadow2-rgb:220,80,130;
  --toxin-focus-rgb:255,200,220;
  --toxin-wave-rgb:255,225,235;
  --toxin-label:#FFD6E5;
  --toxin-dim:rgba(255,158,192,0.14);
  --toxin-border:rgba(255,158,192,0.28);
  --toxin-glow:rgba(255,158,192,0.18);
}
/* Redundant, JS-independent safety net: applies the exact same theme
   values directly from which radio is checked, via :has(). If the JS
   class-toggle mechanism above ever fails to apply for any reason (a
   timing issue, a missed call site), this still guarantees the correct
   theme — pure CSS, nothing that can be "not called yet" or "called with
   a stale value". Modern browsers all support :has() as of 2026. */
body:has(input[name="protocol"][value="OF"]:checked){
  --toxin-rgb:100,210,255;
  --toxin:#64D2FF;
  --olive:#123244;
  --toxin-bright:#DFF8FF;
  --toxin-shadow-rgb:90,195,235;
  --toxin-shadow2-rgb:40,150,195;
  --toxin-focus-rgb:140,225,255;
  --toxin-wave-rgb:205,245,255;
  --toxin-label:#BFEFFF;
  --toxin-dim:rgba(100,210,255,0.14);
  --toxin-border:rgba(100,210,255,0.28);
  --toxin-glow:rgba(100,210,255,0.18);
}
body:has(input[name="protocol"][value="MS"]:checked){
  --toxin-rgb:255,158,192;
  --toxin:#FF9EC0;
  --olive:#4A1030;
  --toxin-bright:#FFF0F5;
  --toxin-shadow-rgb:255,120,160;
  --toxin-shadow2-rgb:220,80,130;
  --toxin-focus-rgb:255,200,220;
  --toxin-wave-rgb:255,225,235;
  --toxin-label:#FFD6E5;
  --toxin-dim:rgba(255,158,192,0.14);
  --toxin-border:rgba(255,158,192,0.28);
  --toxin-glow:rgba(255,158,192,0.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse 900px 500px at 50% 0%, rgba(var(--toxin-rgb),0.05), transparent 65%), var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  padding:32px 24px 80px;
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important;}
}
*:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.wrap{max-width:1180px;margin:0 auto;}

.header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:28px;
  flex-wrap:wrap;
  gap:10px;
}
.header-brand{
  display:flex;
  align-items:center;
  gap:14px;
}
.kb-logo{
  height:77px;
  width:auto;
  max-width:408px;
  object-fit:contain;
  flex-shrink:0;
}
@media (max-width:520px){
  .kb-logo{height:58px;}
}
.title{
  font-family:var(--font-display);
  font-size:28px;
  font-weight:600;
  margin:0;
  letter-spacing:-0.01em;
}
.brand-name{
  background:linear-gradient(90deg, #FF3B4E, #9B59F6);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-transform:uppercase;
}
.status-dot{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.05em;
  color:var(--text-dim);
}
.status-dot span.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--toxin);
  box-shadow:0 0 6px var(--toxin-glow);
  display:inline-block;
  transition:background-color 0.45s ease, box-shadow 0.45s ease;
}

.grid{
  display:grid;
  grid-template-columns:340px 1fr;
  gap:20px;
  align-items:start;
}
@media (max-width:860px){
  .grid{grid-template-columns:1fr;}
}
.panel{
  background:var(--surface);
  border:1px solid var(--toxin-border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:inset 0 1px 0 rgba(var(--toxin-rgb),0.05), 0 0 22px -8px var(--toxin-glow);
  transition:opacity 0.15s ease, border-color 0.45s ease, box-shadow 0.45s ease;
}
.panel + .panel{margin-top:20px;}
.panel.disabled{opacity:0.45; pointer-events:none;}

label.field-label{
  display:block;
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--toxin-label);
  text-shadow:0 0 6px rgba(var(--toxin-rgb),0.25);
  transition:color 0.45s ease, text-shadow 0.45s ease;
  margin-bottom:8px;
}
.field{margin-bottom:20px;}
.field:last-child{margin-bottom:0;}
.protocol-select{
  display:flex;
  gap:18px;
  font-family:var(--font-body);
  font-size:13px;
  color:var(--text);
}
.protocol-select label{
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
}
.protocol-select input{accent-color:var(--toxin);}

input[type=text], textarea, select{
  width:100%;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  padding:10px 12px;
  resize:vertical;
}
input[type=text]:hover, textarea:hover{border-color:var(--toxin-border);}
input[type=text]:focus, textarea:focus{
  outline:none;
  border-color:var(--toxin);
  box-shadow:0 0 0 3px var(--toxin-dim), 0 0 12px -2px var(--toxin-glow);
}
textarea::placeholder, input::placeholder{color:var(--text-faint);}

.rating-track{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:6px;
}
.rating-btn{
  height:44px;
  border-radius:8px;
  border:1px solid transparent;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform 0.18s cubic-bezier(.34,1.4,.64,1), box-shadow 0.18s ease, border-color 0.18s ease, filter 0.12s ease;
  padding:0 2px;
}
.rating-btn .btn-label{
  position:relative;
  z-index:1;
  color:#0A0A0B;
  font-family:var(--font-mono);
  font-size:14px;
  font-weight:700;
}
.rating-btn .btn-fill{
  position:absolute;
  left:0;
  bottom:0;
  height:4px;
  background:rgba(10,10,11,0.4);
  border-radius:0 2px 2px 0;
  transition:width 0.15s ease;
}
.rating-btn:hover{filter:brightness(1.1);}
.rating-btn.active{
  border-color:rgba(255,255,255,0.9);
  box-shadow:0 0 0 2px var(--text), 0 0 10px 1px rgba(255,255,255,0.35), 0 3px 8px -2px rgba(0,0,0,0.5);
  transform:scale(1.05) translateY(-1px);
}
.rating-btn.beyond{
  position:relative;
  border:1px solid rgba(255,255,255,0.35);
}
.rating-btn.beyond.active{
  border-color:rgba(255,255,255,0.9);
  box-shadow:0 0 0 2px var(--text), 0 0 14px 2px rgba(255,215,120,0.5), 0 4px 10px -2px rgba(0,0,0,0.55);
  transform:scale(1.1) translateY(-1px);
}
.rating-btn.beyond::after{
  content:'\2726';
  position:absolute;
  top:3px;
  right:4px;
  font-size:8px;
  color:#0A0A0B;
  opacity:0.75;
  z-index:1;
}
.rating-caption{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--text-dim);
  margin-top:10px;
  min-height:16px;
  opacity:1;
  transition:opacity 0.15s ease;
}
.rating-caption .verdict{
  color:#FFFFFF;
  font-weight:700;
}

.generate-btn{
  width:100%;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg, #3A4014 0%, #9FE000 55%, #D4FF5C 100%);
  border:none;
  border-radius:8px;
  cursor:pointer;
  padding:14px 0;
  box-shadow:0 0 16px 1px rgba(200,230,60,0.4), 0 0 32px 4px rgba(120,200,40,0.22), 0 4px 18px -4px rgba(0,0,0,0.35);
  animation:btnGlowPulse 2.8s ease-in-out infinite;
  transition:transform 0.1s ease, box-shadow 0.25s ease, filter 0.2s ease;
}
.generate-btn .btn-label{
  position:relative;
  z-index:1;
  color:#0F1A05;
  font-family:var(--font-display);
  font-weight:700;
  font-size:20px;
  letter-spacing:0.01em;
  text-shadow:0 1px 1px rgba(255,255,255,0.25);
  pointer-events:none;
}
@keyframes btnGlowPulse{
  0%, 100%{ box-shadow:0 0 16px 1px rgba(200,230,60,0.4), 0 0 32px 4px rgba(120,200,40,0.22), 0 4px 18px -4px rgba(0,0,0,0.35); }
  50%{ box-shadow:0 0 24px 3px rgba(200,230,60,0.55), 0 0 44px 8px rgba(120,200,40,0.34), 0 4px 18px -4px rgba(0,0,0,0.4); }
}
.generate-btn::before{
  content:'';
  position:absolute;
  top:0;
  left:-60%;
  width:40%;
  height:100%;
  background:linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
  transform:skewX(-20deg);
  transition:left 0.6s ease;
  pointer-events:none;
}
.generate-btn::after{
  content:'';
  position:absolute;
  inset:0;
  z-index:0;
  background-image:radial-gradient(ellipse 60% 140% at 50% 50%, rgba(212,255,92,0.6), rgba(159,224,0,0.28) 45%, rgba(159,224,0,0) 75%);
  background-repeat:no-repeat;
  background-size:55% 100%;
  background-position:-30% 50%;
  filter:blur(2px);
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s ease;
}
.generate-btn:hover:not(:disabled)::after{
  opacity:1;
  animation:acidWave 1.6s ease-in-out infinite;
}
@keyframes acidWave{
  0%, 100%{ background-position:-30% 50%; }
  50%{ background-position:130% 50%; }
}
.generate-btn:hover:not(:disabled){
  filter:brightness(1.08);
  animation-play-state:paused;
  box-shadow:0 0 26px 4px rgba(200,230,60,0.6), 0 0 48px 10px rgba(120,200,40,0.4), 0 6px 22px -4px rgba(0,0,0,0.4);
}
.generate-btn:hover:not(:disabled)::before{ left:120%; }
.generate-btn:active:not(:disabled){
  transform:scale(0.97);
  filter:brightness(0.96);
}
.generate-btn:disabled{
  opacity:0.55;
  cursor:default;
  filter:grayscale(0.3);
  animation:none;
  box-shadow:none;
}
.generate-btn:disabled::before{display:none;}
.generate-btn:focus-visible{
  outline:2px solid rgba(190,255,60,0.85);
  outline-offset:3px;
}
@media (prefers-reduced-motion: reduce){
  .generate-btn::before{transition:none; display:none;}
  .generate-btn::after{transition:none; display:none;}
  .generate-btn{animation:none; box-shadow:0 0 20px 2px rgba(200,230,60,0.45), 0 0 36px 6px rgba(120,200,40,0.28), 0 4px 18px -4px rgba(0,0,0,0.35);}
  .btn-label.transitioning,
  .generate-btn.loading{
    animation:none;
    transition:none;
  }
}
.generate-btn.loading{
  opacity:1;
  filter:none;
  cursor:progress;
  animation:toxinCommandPulse 1.8s ease-in-out infinite;
}
@keyframes toxinCommandPulse{
  0%, 100%{ filter:brightness(0.95) saturate(1.05); box-shadow:0 0 12px rgba(160,255,40,0.28); }
  50%{ filter:brightness(1.08) saturate(1.18); box-shadow:0 0 22px rgba(190,255,60,0.45); }
}
.btn-label.transitioning{
  animation:statusSwap 220ms ease;
}
@keyframes statusSwap{
  0%{ opacity:0; transform:translateY(4px); filter:blur(1px); }
  60%{ opacity:1; transform:translateY(0); filter:blur(0); }
  100%{ opacity:1; transform:translateY(0); filter:blur(0); }
}

/* OF ice-blue variant of the button — fully self-contained literal values
   and its own keyframe sets (@keyframes can't be selector-scoped, so a
   separate name is needed wherever the animation itself carries color).
   Deliberately not using shared CSS variables here after the self-
   reference bug that broke the base button — this component now owns
   its own two complete, independently-verifiable color sets. */
body.protocol-of .generate-btn{
  background:linear-gradient(135deg, #123244 0%, #64D2FF 55%, #DFF8FF 100%);
  box-shadow:0 0 16px 1px rgba(90,195,235,0.4), 0 0 32px 4px rgba(40,150,195,0.22), 0 4px 18px -4px rgba(0,0,0,0.35);
  animation-name:btnGlowPulseIce;
}
@keyframes btnGlowPulseIce{
  0%, 100%{ box-shadow:0 0 16px 1px rgba(90,195,235,0.4), 0 0 32px 4px rgba(40,150,195,0.22), 0 4px 18px -4px rgba(0,0,0,0.35); }
  50%{ box-shadow:0 0 24px 3px rgba(90,195,235,0.55), 0 0 44px 8px rgba(40,150,195,0.34), 0 4px 18px -4px rgba(0,0,0,0.4); }
}
body.protocol-of .generate-btn::after{
  background-image:radial-gradient(ellipse 60% 140% at 50% 50%, rgba(205,245,255,0.6), rgba(100,210,255,0.28) 45%, rgba(100,210,255,0) 75%);
}
body.protocol-of .generate-btn:hover:not(:disabled){
  box-shadow:0 0 26px 4px rgba(90,195,235,0.6), 0 0 48px 10px rgba(40,150,195,0.4), 0 6px 22px -4px rgba(0,0,0,0.4);
}
body.protocol-of .generate-btn:focus-visible{
  outline-color:rgba(140,225,255,0.85);
}
@media (prefers-reduced-motion: reduce){
  body.protocol-of .generate-btn{box-shadow:0 0 20px 2px rgba(90,195,235,0.45), 0 0 36px 6px rgba(40,150,195,0.28), 0 4px 18px -4px rgba(0,0,0,0.35);}
}
body.protocol-of .generate-btn.loading{
  animation-name:toxinCommandPulseIce;
}
@keyframes toxinCommandPulseIce{
  0%, 100%{ filter:brightness(0.95) saturate(1.05); box-shadow:0 0 12px rgba(90,195,235,0.28); }
  50%{ filter:brightness(1.08) saturate(1.18); box-shadow:0 0 22px rgba(140,225,255,0.45); }
}

/* MA Sweet Voice pink variant of the button — same self-contained-literal-
   values structure as the ice-blue variant above, its own keyframe names
   since @keyframes can't be selector-scoped. Kept fully light (no dark
   corner) per the contrast reasoning above. */
body.protocol-ms .generate-btn{
  background:linear-gradient(135deg, #F76C93 0%, #FF9EC0 55%, #FFF0F5 100%);
  box-shadow:0 0 16px 1px rgba(255,120,160,0.4), 0 0 32px 4px rgba(220,80,130,0.22), 0 4px 18px -4px rgba(0,0,0,0.25);
  animation-name:btnGlowPulsePink;
}
@keyframes btnGlowPulsePink{
  0%, 100%{ box-shadow:0 0 16px 1px rgba(255,120,160,0.4), 0 0 32px 4px rgba(220,80,130,0.22), 0 4px 18px -4px rgba(0,0,0,0.25); }
  50%{ box-shadow:0 0 24px 3px rgba(255,120,160,0.55), 0 0 44px 8px rgba(220,80,130,0.34), 0 4px 18px -4px rgba(0,0,0,0.3); }
}
body.protocol-ms .generate-btn::after{
  background-image:radial-gradient(ellipse 60% 140% at 50% 50%, rgba(255,225,235,0.6), rgba(255,158,192,0.28) 45%, rgba(255,158,192,0) 75%);
}
body.protocol-ms .generate-btn:hover:not(:disabled){
  box-shadow:0 0 26px 4px rgba(255,120,160,0.6), 0 0 48px 10px rgba(220,80,130,0.4), 0 6px 22px -4px rgba(0,0,0,0.3);
}
body.protocol-ms .generate-btn:focus-visible{
  outline-color:rgba(255,200,220,0.85);
}
@media (prefers-reduced-motion: reduce){
  body.protocol-ms .generate-btn{box-shadow:0 0 20px 2px rgba(255,120,160,0.45), 0 0 36px 6px rgba(220,80,130,0.28), 0 4px 18px -4px rgba(0,0,0,0.25);}
}
body.protocol-ms .generate-btn.loading{
  animation-name:toxinCommandPulsePink;
}
@keyframes toxinCommandPulsePink{
  0%, 100%{ filter:brightness(0.95) saturate(1.05); box-shadow:0 0 12px rgba(255,120,160,0.28); }
  50%{ filter:brightness(1.08) saturate(1.18); box-shadow:0 0 22px rgba(255,200,220,0.45); }
}

.output-box{
  min-height:180px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
  font-size:14px;
  line-height:1.6;
  color:var(--text);
  white-space:pre-wrap;
}
.output-box.empty{color:var(--text-faint); font-style:italic;}
.output-box.error{color:var(--danger); background:var(--danger-dim); border-color:var(--danger);}

.action-row{
  display:flex;
  gap:10px;
  margin-top:14px;
}
.feedback-card{
  margin-top:14px;
  padding:12px 14px;
  border:1px solid var(--toxin-border);
  border-radius:8px;
  background:rgba(var(--toxin-rgb),0.04);
}
.feedback-card-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.feedback-card-label{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.04em;
  color:var(--text-dim);
}
.feedback-stars{
  display:flex;
  gap:2px;
}
.feedback-star{
  background:none;
  border:none;
  cursor:pointer;
  font-size:20px;
  line-height:1;
  padding:4px;
  color:var(--border-strong);
  transition:color 0.12s ease, transform 0.12s ease;
}
.feedback-star:hover,
.feedback-star.filled{
  color:var(--toxin);
}
.feedback-star:hover{ transform:scale(1.15); }
.feedback-comment{
  width:100%;
  margin-top:10px;
  padding:8px 10px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  font-family:var(--font-body);
  font-size:13px;
  resize:vertical;
  min-height:44px;
}
.feedback-comment:focus{
  outline:none;
  border-color:var(--toxin);
  box-shadow:0 0 0 3px var(--toxin-dim);
}
.feedback-status{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--text-faint);
  margin-top:8px;
  min-height:14px;
}
.feedback-status.sent{ color:var(--toxin); }
.feedback-submit-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:10px;
}
.feedback-submit-btn{
  padding:6px 16px;
  background:var(--toxin);
  color:#0F1A05;
  border:none;
  border-radius:6px;
  font-family:var(--font-body);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:opacity 0.15s ease, transform 0.1s ease;
}
.feedback-submit-btn:hover:not(:disabled){ opacity:0.88; }
.feedback-submit-btn:active:not(:disabled){ transform:scale(0.97); }
.feedback-submit-btn:disabled{
  opacity:0.35;
  cursor:default;
}
.btn-secondary{
  flex:1;
  background:transparent;
  border:1px solid var(--toxin-border);
  color:var(--text-dim);
  border-radius:8px;
  padding:9px 0;
  font-family:var(--font-body);
  font-size:13px;
  cursor:pointer;
}
.btn-secondary:hover{border-color:var(--toxin); color:var(--text);}
.btn-secondary:disabled{opacity:0.4;cursor:default;}
.btn-secondary.copied{color:var(--accent); border-color:var(--accent);}

.prev-toggle{
  display:block;
  background:none;
  border:none;
  color:var(--text-faint);
  font-family:var(--font-mono);
  font-size:11px;
  cursor:pointer;
  padding:10px 0 0;
  text-align:left;
}
.prev-toggle:hover{color:var(--text-dim);}
.prev-toggle.active{color:var(--warm);}

.field-counter{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--text-faint);
  margin-top:6px;
  text-align:right;
}
.field-counter.low{color:var(--warm);}

.small-note{
  font-family:var(--font-mono);
  font-size:12px;
  color:#FFFFFF;
  margin-top:10px;
}



.mode-badge{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  padding:2px 8px;
  border-radius:4px;
  background:var(--olive);
  color:var(--toxin);
  border:1px solid var(--toxin-border);
  margin-left:8px;
  vertical-align:middle;
  transition:background-color 0.45s ease, color 0.45s ease, border-color 0.45s ease;
}

.lint-box{
  margin-top:14px;
  border-radius:8px;
  padding:10px 12px;
  font-size:12px;
  line-height:1.5;
}
.lint-box.lint-ok{
  background:rgba(99,191,123,0.1);
  border:1px solid rgba(99,191,123,0.35);
  color:#7FD99A;
}
.lint-box.lint-warn{
  background:var(--warm-dim);
  border:1px solid rgba(242,166,90,0.4);
  color:var(--warm);
}
.lint-title{
  font-family:var(--font-mono);
  font-weight:600;
  margin-bottom:6px;
}
.lint-box ul{
  margin:0;
  padding-left:18px;
}
.lint-box li{margin-bottom:3px;}
.lint-box li:last-child{margin-bottom:0;}
</style>

  function isHalfPoint(lvl){
    return typeof lvl === 'string' && lvl.includes('.5');
  }

  // Red (1) -> green (5) -> gold (6). Pure function of the level string.
  function ratingColor(lvl){
    if(lvl === '6'){
      return 'hsl(45, 95%, 55%)'; // gold, distinct from the 1-5 run
    }
    const idx = LEVELS.indexOf(lvl); // 1 through 5 occupy indices 0-8
    const t = idx / 8;
    const hue = t * 120; // 0 = red, 120 = green
    return `hsl(${hue.toFixed(0)}, 70%, 48%)`;
  }

  // Position of a level along the 1-5 run, 0 to 1. Used to draw a
  // proportional fill indicator that carries the same "where am I on the
  // scale" information as color, but without depending on color at all —
  // so the scale still reads correctly for colorblind users or in
  // grayscale. Level 6 returns 1 (full) since it's the top of the scale,
  // even though it renders as a visually distinct gold "beyond" tier.
  function ratingFillFraction(lvl){
    if(lvl === '6') return 1;
    const idx = LEVELS.indexOf(lvl);
    return idx / 8;
  }

  // OF's own color scale, parallel to ratingColor/ratingFillFraction but
  // over its 5-tier scale instead of MA's 10-level one. No gold "beyond"
  // tier here — OF's scale has no equivalent of MA's rating-6 celebration
  // tier, "High" is simply the top of this scale.
  function ofTierColor(tier){
    const idx = OF_TIERS.indexOf(tier);
    const t = idx / (OF_TIERS.length - 1);
    const hue = t * 120;
    return `hsl(${hue.toFixed(0)}, 70%, 48%)`;
  }

  function ofTierFillFraction(tier){
    const idx = OF_TIERS.indexOf(tier);

  /**
   * @param {{rating: string}} params
   * @returns {string} system prompt — OF's immutable protocol text plus the
   *   same kind of short runtime-parameters block buildMASystemPrompt uses.
   *   No star collection line here: OF has no star mechanic at all, since
   *   that's a MA-specific parent-facing device, not part of a third-person
   *   evaluation document.
   */
  function buildOFSystemPrompt(params){
    const tier = OF_TIERS.includes(params.rating) ? params.rating : 'Medium';

    const runtimeParams = [
      'RUNTIME PARAMETERS FOR THIS REPORT (computed from the app, not part of the protocol text above — apply the protocol\'s rules using these exact values):',
      '- Internal qualitative guidance tier for this report: ' + tier + '.',
      '- Tone and balance to apply, per this tier: ' + OF_QUALITATIVE_TIER_DESC[tier],
      '- This tier is guidance for tone only. It must never appear in the output as a score, label, heading, or recommendation, in this or any other form.'
    ].join('\n');

    return OF_PROTOCOL_V1_4_SOURCE + '\n\n────────────────────────────────────────\n\n' + runtimeParams;
  }

  /**
   * Cleans a raw pasted Krisp transcript before it enters the prompt.
   * Deliberately conservative: this removes mechanical transcript noise
   * only (timestamps, speaker labels, system markers, blank/duplicate
   * lines). It never summarizes, rewrites, or interprets the content —
   * that judgment stays with the model, working from clean input.
   *
   * @param {string} rawText
   * @returns {string} cleaned transcript text
   */
  /**
   * Substitutes the actual teacher's name into a fully-built system prompt.
   * Both protocols' immutable text hardcodes "Layne" (in the sign-off
   * instruction and the "Teacher Notes supplied by Layne" reference) —
   * this is a pure, deterministic Facts-layer substitution, done client-side
   * on the already-built prompt text, exactly like student name or rating
   * are already threaded through buildUserMessage. The backend never needs
   * to know anything about prompt structure; it only ever proxies whatever
   * text it's given.
   * @param {string} promptText - a fully-built system prompt (MA or OF)
   * @param {string} teacherName - defaults to 'Layne' if empty/omitted
   * @returns {string}
   */
  function applyTeacherIdentity(promptText, teacherName){
    const name = (teacherName || '').trim();
    if(!name || name.toLowerCase() === 'layne') return promptText; // no-op, preserves exact existing behavior
    return promptText.split('Layne').join(name);
  }

  function cleanTranscript(rawText){
    if(!rawText) return '';

    let text = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    let lines = text.split('\n');

    // Timestamps: only strip when they are clearly a transcript marker —
    // either the entire line is just a timestamp, or it's a bracketed/
    // parenthesized marker at the very start of a line (e.g. "[00:12:34]").
    // A bare time like "3:45" appearing naturally inside a sentence (e.g.
    // a lesson about telling time) is left untouched — that's real content,
    // not transcript noise, and stripping it would be over-cleaning.
    const wholeLineTimestampPattern = /^\s*[\[\(]?\d{1,2}:\d{2}(:\d{2})?[\]\)]?\s*$/;
    const leadingBracketedTimestampPattern = /^\s*[\[\(]\d{1,2}:\d{2}(:\d{2})?[\]\)]\s*/;

    // Leading "Speaker 1:", "Speaker:", "Teacher:", "Student:" style labels
    // — only when they look like a transcript label at the start of a line,
    // not when "teacher" or "student" appears naturally in a sentence.
    const speakerLabelPattern = /^\s*(speaker\s*\d*|teacher|student|tutor)\s*[:\-]\s*/i;

    // Obvious system-generated noise markers.
    const systemNoiseInline = /\[(inaudible|crosstalk|cross[-\s]?talk|music|silence|background noise|noise|laughter|pause|unintelligible|audio (cut|drop)(ped)?)\]/gi;
    const systemNoiseLineOnly = /^\s*\[(inaudible|crosstalk|cross[-\s]?talk|music|silence|background noise|noise|laughter|pause|unintelligible)\]\s*$/i;

    // Lines that are pure punctuation/symbol noise with no real content
    // (e.g. a stray "---", "...", "###" left over from export formatting).
    const symbolOnlyLinePattern = /^[\s\-_=~*#>.]{1,}$/;

    lines = lines.map(line => {
      let l = line;
      l = l.replace(leadingBracketedTimestampPattern, '');
      l = l.replace(systemNoiseInline, '');
      l = l.replace(speakerLabelPattern, '');
      l = l.replace(/[ \t]{2,}/g, ' ');
      return l.trim();
    });

    lines = lines.filter(l => {
      if(l.length === 0) return false;
      if(wholeLineTimestampPattern.test(l)) return false;
      if(systemNoiseLineOnly.test(l)) return false;
      if(symbolOnlyLinePattern.test(l)) return false;
      return true;
    });

    // Remove duplicated adjacent lines (case-insensitive) — a common Krisp
    // artifact where the same fragment gets transcribed twice in a row.
    const deduped = [];
    for(const l of lines){
      const prev = deduped[deduped.length - 1];
      if(!prev || prev.toLowerCase() !== l.toLowerCase()){
        deduped.push(l);
      }
    }

    let cleaned = deduped.join('\n');
    cleaned = cleaned.replace(/\n{2,}/g, '\n');
    cleaned = cleaned.replace(/[ \t]{2,}/g, ' ');
    return cleaned.trim();
  }

  /**
   * @param {{studentName: string, notes: string, remarks: string, rating: string}} params
   * @returns {string} user message
   */
  function buildUserMessage(params){
    const name = (params.studentName || '').trim() || 'the student';
    const notes = (params.notes || '').trim();
    const remarks = (params.remarks || '').trim();
    const rating = params.rating || '3';

    let msg = `Student: ${name}\n`;
    msg += `Rating: ${rating}/5\n`;
    msg += `Krisp notes (infer the lesson topic from this transcript):\n${notes || '(no notes provided)'}\n`;
    if(remarks) msg += `Special remarks to incorporate:\n${remarks}\n`;
    return msg;
  }

  /**
   * Shared by every protocol's validator. These three checks encode rules
   * that are identical across MA and OF (no bold, no italics, no other
   * markdown) — factored out once so a future fix to this logic (like the
   * fill-in-the-blank false-positive fixed earlier) benefits every protocol
   * automatically instead of needing to be repeated per protocol.
   * @param {string} text
   * @returns {string[]} warnings
   */
  function checkForbiddenFormatting(text){
    const warnings = [];

    // --- bold text (markdown ** or __) ---
    if(/(?<!\*)\*\*(?!\*)[^*\n]+(?<!\*)\*\*(?!\*)|(?<!_)__(?!_)[^_\n]+(?<!_)__(?!_)/.test(text)){
      warnings.push('Bold text detected — the protocol forbids bold formatting.');
    }

    // --- italics (single * or _ wrapping text, not part of a bullet or bold pair) ---
    if(/(?<!\*)\*(?!\*)[^*\n]+\*(?!\*)|(?<!_)_(?!_)[^_\n]+_(?!_)/.test(text)){
      warnings.push('Italic text detected — the protocol forbids italic formatting.');
    }

    // --- other markdown: headings, inline code, links ---
    if(/^#{1,6}\s/m.test(text) || /`[^`\n]+`/.test(text) || /\[[^\]]+\]\([^)]+\)/.test(text)){
      warnings.push('Markdown syntax detected (heading, code, or link) — plain text and emojis only.');
    }

    return warnings;
  }

  function analyzeMAOutput(text, lvl, teacherName, signoffPhrase, signoffEmoji, lengthTier){
    const name = (teacherName || 'Layne').trim();
    const escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const phrase = signoffPhrase || 'Cheers,';
    const emoji = signoffEmoji || '🐺';
    const escapedPhrase = phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const warnings = [];
    const tier = lengthTier || LENGTH_TIERS.long;

    // --- length: two tiers, matching the protocol's own two-tier rule ---
    // The soft target is a normal, expected nudge when a report runs long.
    // The hard ceiling is absolute and immutable for whichever length
    // format (short/medium/long) was selected; a report reaching or
    // exceeding it is a critical failure, not a style note — it is not a
    // report that can be sent, full stop.
    const charCount = text.trim().length;
    if(charCount >= tier.hardCeiling){
      warnings.push('CRITICAL: Report is ' + charCount + ' characters — at or over the absolute, immutable ' + tier.hardCeiling + '-character limit. This cannot be sent as-is.');
    }else if(charCount > tier.softTarget){
      warnings.push('Report is ' + charCount + ' characters — over the ' + tier.softTarget + ' working target. Trim before sending to stay safely under the ' + tier.hardCeiling + ' absolute limit.');
    }

    // --- exact star count (uses the same approved list sent to the model) ---
    // Counting must be scoped to the "Total Stars Today" section only.
    // Counting across the whole report is wrong: the protocol allows any
    // approved star emoji to double as a decorative vocabulary icon (e.g.
    // "Soul ✨ – ..."), which would otherwise inflate the count and flag a
    // perfectly correct report as an error.
    const starRegex = new RegExp('[' + APPROVED_STARS_ALL.join('') + ']', 'gu');
    const starsSectionMatch = text.match(/total stars today:?\s*([\s\S]*?)(?:\n\s*\n|$)/i);
    if(!starsSectionMatch){
      warnings.push('Could not locate the "Total Stars Today" section to verify star count.');
    }else{
      const stars = (starsSectionMatch[1].match(starRegex) || []).length;
      if(stars !== 10) warnings.push('Star count is ' + stars + ', expected exactly 10.');
    }

    warnings.push(...checkForbiddenFormatting(text));

    // --- Parent Note gating ---
    const hasParentNote = /Parent Note:/i.test(text);
    const expectParentNote = MA_PARENT_NOTE_LEVELS.includes(lvl);
    if(expectParentNote && !hasParentNote) warnings.push('Parent Note section is missing (required at ratings 1, 1.5, 2, and 2.5).');
    if(!expectParentNote && hasParentNote) warnings.push('Parent Note section is present but should be omitted above rating 2.5.');

    // --- exactly one Superpower ---
    const superpowerCount = (text.match(/🦸/g) || []).length;
    if(superpowerCount === 0) warnings.push('No "Today\'s Superpower" emoji (🦸) found.');
    if(superpowerCount > 1) warnings.push('More than one Superpower emoji (🦸) found — should be exactly one.');

    // --- exactly one homework mission ---
    const missions = ['Vocabulary Mission','Grammar Mission','Speaking Mission'].filter(m => text.includes(m));
    if(missions.length === 0) warnings.push('No homework mission found.');
    if(missions.length > 1) warnings.push('Multiple homework missions found — should be exactly one.');

    // --- exact closing ---
    const signoffRegex = new RegExp(escapedPhrase + '\\s*\\n?\\s*Teacher ' + escapedName + '\\s*' + emoji + '\\s*$', 'i');
    const signoffMatch = text.trim().match(signoffRegex);
    if(!signoffMatch){
      warnings.push('Closing sign-off does not exactly match "' + phrase + ' / Teacher ' + name + ' ' + emoji + '".');
    }

    // --- no third-person self-reference outside the signature ---
    // The teacher's name/title should appear exactly once: the final
    // signature line. Anywhere else, it signals the model slipped into
    // writing about the teacher in the third person ("Teacher Layne
    // cannot wait...") instead of speaking in first person throughout,
    // as a direct-address letter to the student requires.
    const bodyText = signoffMatch ? text.trim().slice(0, -signoffMatch[0].length) : text.trim();
    if(new RegExp('Teacher\\s+' + escapedName, 'i').test(bodyText)){
      warnings.push('Teacher is referred to in the third person in the body of the letter — should speak in first person throughout, with "Teacher ' + name + '" appearing only in the final signature.');
    }

    // --- no leaked template placeholders ---
    // If the model leaves an unused vocabulary/grammar slot as a blank or
    // literal placeholder instead of omitting the line entirely, the raw
    // bracketed template text itself would leak straight into the output.
    // This is a real, checkable structural fact, not a judgment call.
    const placeholderPatterns = [
      /\[Word\s*\d*\]/i, /\[Emoji\]/i, /\[Short definition\]/i, /\[phonetic form\]/i,
      /\[observation\]/i, /\[Grammar Rule\]/i, /\[Optional Grammar Rule\]/i,
      /\[Example sentence\s*\d*\]/i, /\[Task\]/i, /\[Student Name\]/i, /\[Lesson Topic\]/i
    ];
    const leakedPlaceholder = placeholderPatterns.some(re => re.test(text));
    if(leakedPlaceholder){
      warnings.push('Unfilled template placeholder text was left in the output — unused vocabulary/grammar slots must be omitted entirely, not left blank.');
    }

    // --- Grammar Points We Covered must not be left in empty ---
    // If no grammar was actually taught, the whole heading should be
    // omitted — not included with nothing under it. Deliberately checks
    // only for "is there real content", not "is it numbered like MA's
    // template" — Sweet Voice's own template doesn't number grammar
    // points, and that's a legitimate, correctly-formatted difference,
    // not something to flag.
    const grammarHeaderMatch = text.match(/Grammar Points We Covered:?\s*\n/i);
    if(grammarHeaderMatch){
      const afterHeader = text.slice(grammarHeaderMatch.index + grammarHeaderMatch[0].length);
      const nextSectionMatch = afterHeader.match(/Today's Superpower/i);
      if(nextSectionMatch){
        const between = afterHeader.slice(0, nextSectionMatch.index).trim();
        if(!between){
          warnings.push('"Grammar Points We Covered" heading is present but appears empty — omit the entire section if no meaningful grammar instruction occurred.');
        }
      }
    }

    // --- Length-tier content trim rule compliance (Short/Medium) ---
    // The prompt makes these reductions mandatory (not just suggested) so
    // Short and Medium are actually achievable, rather than relying on the
    // character ceiling alone to force compression. This checks the model
    // actually followed that instruction, using "Mini Homework" as the
    // bounding marker since — unlike "Today's Superpower" above — it's
    // present, unconditional, and identically named in both the MA and
    // Sweet Voice templates.
    if(tier.key === 'short' || tier.key === 'medium'){
      if(tier.key === 'short'){
        const pronHeaderMatch = text.match(/Pronunciation Focus:?\s*(?:\(optional\))?\s*\n/i);
        if(pronHeaderMatch){
          const afterPron = text.slice(pronHeaderMatch.index + pronHeaderMatch[0].length);
          const nextMatch = afterPron.match(/Grammar (?:&|and) Sentence Practice/i);
          const between = (nextMatch ? afterPron.slice(0, nextMatch.index) : afterPron).trim();
          if(between){
            warnings.push('Short reports must omit Pronunciation Focus entirely, per the length-tier content rule — found present with content.');
          }
        }
      }

      const grammarHeaderMatch2 = text.match(/Grammar Points We Covered:?\s*\n/i);
      if(grammarHeaderMatch2){
        const afterHeader2 = text.slice(grammarHeaderMatch2.index + grammarHeaderMatch2[0].length);
        const homeworkMatch = afterHeader2.match(/Mini Homework/i);
        const between2 = homeworkMatch ? afterHeader2.slice(0, homeworkMatch.index) : afterHeader2;
        // Each grammar point contributes two "👉" example lines in both
        // templates (MA numbers its points, Sweet Voice doesn't — this
        // count is format-agnostic across both).
        const pointerCount = (between2.match(/👉/g) || []).length;
        const pointCount = Math.round(pointerCount / 2);
        const maxAllowed = tier.key === 'short' ? 2 : 3;
        if(pointCount > maxAllowed){
          warnings.push('Report includes ' + pointCount + ' grammar points — the length-tier content rule caps ' + tier.label + ' reports at ' + maxAllowed + '.');
        }
      }
    }

    return warnings;
  }

  const OF_REQUIRED_SECTIONS = [
    'Strengths',
    'Areas for Improvement',
    'Learning Suggestions'
  ];

  /**
   * @param {string} text - generated OF report text
   * @param {string} lvl - rating level string (unused directly here — OF's
   *   tone integration is handled entirely in the prompt; the validator only
   *   checks structure, which the protocol requires to stay fixed regardless
   *   of rating)
   * @returns {string[]} list of human-readable warnings, empty if all checks pass
   */
  function analyzeOFOutput(text, lvl, teacherName){
    const name = (teacherName || 'Layne').trim();
    const escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const warnings = [];

    warnings.push(...checkForbiddenFormatting(text));

    // --- internal qualitative tier must never leak into the output ---
    // Only the two compound, slash-joined tier names are checked here
    // ("Low/Medium", "Medium/High") — those are distinctive enough that
    // their presence is a real signal. Plain "Low", "Medium", or "High"
    // are NOT checked: those are ordinary English words that show up
    // constantly in legitimate prose ("high confidence", "low anxiety"),
    // so flagging them would just be noise, not a real leakage signal.
    if(/\bLow\/Medium\b|\bMedium\/High\b/i.test(text)){
      warnings.push('Internal qualitative guidance tier label appears to have leaked into the output — it must never be shown.');
    }

    // --- all 3 required sections present ---
    const sectionRegexes = OF_REQUIRED_SECTIONS.map(section =>
      new RegExp('(^|\\n)\\s*' + section.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:?\\s*(\\n|$)', 'i')
    );
    const missingSections = OF_REQUIRED_SECTIONS.filter((section, i) => !sectionRegexes[i].test(text));
    if(missingSections.length > 0){
      warnings.push('Missing required section(s): ' + missingSections.join(', ') + '.');
    }

    // --- section order, checked only among sections that were actually found ---
    // (a missing section is already flagged above — no need to double-report it here)
    const foundIndices = sectionRegexes
      .map(re => text.search(re))
      .filter(idx => idx !== -1);
    const isAscending = foundIndices.every((idx, i) => i === 0 || idx > foundIndices[i - 1]);
    if(!isAscending){
      warnings.push('Sections are out of order — expected Strengths, then Areas for Improvement, then Learning Suggestions.');
    }

    // --- per-section character limits (Strengths, Areas for Improvement) ---
    // These are two SEPARATE fields on the delivery platform, each with its
    // own independent 1500-character limit — not one combined budget. Each
    // is checked individually against a 1300 working limit. Only checked
    // when the section was actually found (a missing section is already
    // flagged above).
    function extractSectionBody(sectionName, followingSectionNames){
      const headerRegex = new RegExp('(^|\\n)\\s*' + sectionName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:?\\s*\\n', 'i');
      const headerMatch = text.match(headerRegex);
      if(!headerMatch) return null;
      const startIdx = headerMatch.index + headerMatch[0].length;
      let endIdx = text.length;
      for(const nextName of followingSectionNames){
        const nextRegex = new RegExp('\\n\\s*' + nextName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:?\\s*\\n', 'i');
        const nextMatch = text.slice(startIdx).match(nextRegex);
        if(nextMatch){
          endIdx = startIdx + nextMatch.index;
          break;
        }
      }
      return text.slice(startIdx, endIdx).trim();
    }

    const strengthsBody = extractSectionBody('Strengths', ['Areas for Improvement', 'Learning Suggestions', 'Prepared by']);
    if(strengthsBody !== null && strengthsBody.length > 1300){
      warnings.push('Strengths section is ' + strengthsBody.length + ' characters — over the platform\'s 1300-character field limit.');
    }

    const areasBody = extractSectionBody('Areas for Improvement', ['Learning Suggestions', 'Prepared by']);
    if(areasBody !== null && areasBody.length > 1300){
      warnings.push('Areas for Improvement section is ' + areasBody.length + ' characters — over the platform\'s 1300-character field limit.');
    }

    // --- word count target: 180-300 words, both bounds matter now that the
    // report is a short three-section narrative rather than a one-page
    // document with only an upper ceiling ---
    const wordCount = text.trim().split(/\s+/).filter(Boolean).length;
    if(wordCount < 180){
      warnings.push('Report is ' + wordCount + ' words — shorter than the intended 180-300 word range.');
    }else if(wordCount > 300){
      warnings.push('Report is ' + wordCount + ' words — longer than the intended 180-300 word range. Consider tightening.');
    }

    // --- exact closing ---
    if(!new RegExp('Prepared by\\s*\\n?\\s*Teacher ' + escapedName + '\\s*$', 'i').test(text.trim())){
      warnings.push('Closing sign-off does not exactly match "Prepared by / Teacher ' + name + '".');
    }

    return warnings;
  }

  // ProtocolManager: both official protocols implement the same interface
  // (buildSystemPrompt, analyze), so the UI layer only ever needs to know
  // which key is selected — it never branches on protocol-specific logic
  // itself. Adding a future third protocol means adding one more entry here,
  // not touching the generate() flow.
  const PROTOCOLS = {
    MA: {
      key: 'MA',
      label: 'Classic',
      buildSystemPrompt: buildMASystemPrompt,
      analyze: (text, lvl, teacherName, lengthFormat) =>
        analyzeMAOutput(text, lvl, teacherName, undefined, undefined, LENGTH_TIERS[lengthFormat] || LENGTH_TIERS.long)
    },
    MS: {
      key: 'MS',
      label: 'Sugarcoat',
      buildSystemPrompt: buildSweetSystemPrompt,
      // Every check is the exact same shared function as MA's — only the
      // expected sign-off phrase/emoji differ, passed as extra arguments.
      analyze: (text, lvl, teacherName, lengthFormat) =>
        analyzeMAOutput(text, lvl, teacherName, 'Love,', '💖', LENGTH_TIERS[lengthFormat] || LENGTH_TIERS.long)
    },
    OF: {
      key: 'OF',
      label: 'OF Protocol (Trial Evaluation)',
      buildSystemPrompt: buildOFSystemPrompt,
      analyze: analyzeOFOutput
    }
  };

  // Three selectable report-length formats for MA (Classic) and Sweet
  // Voice (Sugarcoat) only — OF has its own separate per-section
  // character-limit system and isn't affected by this at all. "Long" is
  // the original, unchanged MA behavior (4500 soft / 4800 hard), kept as
  // the default so nothing changes for existing use unless a teacher
  // deliberately picks Short or Medium.
  const LENGTH_TIERS = {
    short: {
      key:'short', label:'Short', softTarget:2200, hardCeiling:2400,
      trimRule: 'For the SHORT format, the following reductions are mandatory, not optional — they exist specifically to make this budget achievable, and they apply only to Short, never to Medium or Long. Omit the Pronunciation Focus section entirely, regardless of whether pronunciation was practiced during the lesson. Include at most 2 grammar points under "Grammar Points We Covered" — if more were genuinely covered, select only the 2 most important and omit the rest; if none apply, omit the entire section as usual. Keep every vocabulary Note to 4 words or fewer.'
    },
    medium: {
      key:'medium', label:'Medium', softTarget:2800, hardCeiling:3000,
      trimRule: 'For the MEDIUM format, include at most 3 grammar points under "Grammar Points We Covered" — if more were genuinely covered, select only the 3 most important. Keep every vocabulary Note to 6 words or fewer. Pronunciation Focus may be included if it applies, but keep it to at most 2 lines.'
    },
    long: {
      key:'long', label:'Long', softTarget:4500, hardCeiling:4800,
      trimRule: 'For the LONG format, no additional content reduction applies beyond the Universal Rules and Template above — include every applicable optional section in full.'
    }
  };

  // Substitutes the __SOFT_TARGET__ / __HARD_CEILING__ / __LENGTH_TRIM_RULE__
  // tokens embedded in MA_PROTOCOL_V2_9_SOURCE's character-limit language
  // with the numbers and mandatory content-reduction rule for whichever
  // tier was selected. Falls back to 'long' for any unknown or
  // missing key, so old drafts / callers that never pass a lengthFormat at
  // all keep behaving exactly as before this feature existed.
  function applyLengthTier(promptText, lengthFormatKey){
    const tier = LENGTH_TIERS[lengthFormatKey] || LENGTH_TIERS.long;
    return promptText
      .split('__SOFT_TARGET__').join(String(tier.softTarget))
      .split('__HARD_CEILING__').join(String(tier.hardCeiling))
      .split('__LENGTH_TRIM_RULE__').join(tier.trimRule);
  }

  return {
    LEVELS,
    LEVEL_TONE_DESC,
    OF_TIERS,
    OF_QUALITATIVE_TIER_DESC,
    MA_PARENT_NOTE_LEVELS,
    MA_PROTOCOL_V2_9_SOURCE,
    OF_PROTOCOL_V1_4_SOURCE,
    LENGTH_TIERS,
    isHalfPoint,
    ratingColor,
    ratingFillFraction,
    ofTierColor,
    ofTierFillFraction,
    buildMASystemPrompt,
    buildSweetSystemPrompt,
    buildOFSystemPrompt,
    cleanTranscript,
    buildUserMessage,
    applyTeacherIdentity,
    analyzeMAOutput,
    analyzeOFOutput,
    checkForbiddenFormatting,
    PROTOCOLS
  };
})();

const LOGO_DEFAULT_SRC = kbLogo.src; // the original green lockup, captured before any swap
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function updateLogo(){
  const key = currentProtocolKey();
  const nextSrc = key === 'MS' ? kbLogo.dataset.logoMs
                : key === 'OF' ? kbLogo.dataset.logoOf
                : LOGO_DEFAULT_SRC;
  if(nextSrc === kbLogo.src) return; // no actual change — skip the flourish
  kbLogo.src = nextSrc;
  if(prefersReducedMotion || typeof kbLogo.animate !== 'function') return;
  // Soft "iris" bloom: logo dissolves in from a bright, slightly-scaled glow
  // back to normal, echoing the coloration swap rather than a hard cut.
  kbLogo.animate(
    [
      { opacity:0.15, filter:'brightness(2.4) saturate(1.6) blur(2px)', transform:'scale(0.96)' },
      { opacity:1,    filter:'brightness(1) saturate(1) blur(0px)',     transform:'scale(1)' }

    { duration:480, easing:'ease-out' }
  );
}

// Cosmetic status cycle shown on the button while a request is in flight.
// Purely presentational — it does not gate, delay, or represent real

// It exists only so the wait feels like KIDBUSTER executing a protocol
// rather than the UI silently freezing. No fake progress bar, no timers
// tied to actual milestones — just a short, honest-feeling text cycle.
const GENERATION_STATUS_MESSAGES = [
  '📡 Acquiring classroom intelligence...',
  '🧪 Isolating key information...',
  '🧠 Devising the optimal approach...',
  '⚗ Refining the final report...',
  '🛡 Eliminating inconsistencies...'
];
// Shown once, only when generation actually succeeds — never part of the
// cycling loop above, so it can't appear mid-request or loop back around
// to "Acquiring..." on a slow response, which would be misleading.
const GENERATION_COMPLETE_MESSAGE = '✔ Protocol complete.';
let statusCycleTimer = null;

// Swaps the status label text with a brief fade/slide transition.
// Cosmetic only — no timing here reflects real backend progress.
function setStatusText(text){
  generateBtnLabel.classList.remove('transitioning');
  void generateBtnLabel.offsetWidth; // force reflow so the animation restarts
  generateBtnLabel.classList.add('transitioning');
  generateBtnLabel.textContent = text;
}

function setLoading(loading){
  generateBtn.disabled = loading;
  generateBtn.classList.toggle('loading', loading);

    let i = 0;
    setStatusText(GENERATION_STATUS_MESSAGES[0]);
    statusCycleTimer = setInterval(() => {
      i = (i + 1) % GENERATION_STATUS_MESSAGES.length;
      setStatusText(GENERATION_STATUS_MESSAGES[i]);
    }, 900);

function renderLint(warnings){

  if(warnings === null){

      warnings.map(w => '<li>' + w + '</li>').join('') + '</ul>';
  }
}

// NOTE: this is the one function in this file that isn't portable as-is —
// calling the Anthropic API directly from the browser only works because
// this is a single-user local file. A hosted version MUST move this call
// server-side (e.g. a Next.js API route) so the API key is never shipped
// to the browser.
// ---------- access key gate ----------
// Not a real auth system — no accounts, no per-user tracking. Just a
// shared secret so a bare public URL can't be found and used by strangers
// to spend API budget. Appropriate for a small private team; real auth is
// a separate, later concern once this becomes a genuine multi-tenant SaaS.
const ACCESS_KEY_STORAGE = 'kidbuster_access_key';

function getStoredAccessKey(){
  try{ return localStorage.getItem(ACCESS_KEY_STORAGE); }catch(e){ return null; }
}

function promptForAccessKey(){
  const key = window.prompt('Enter the Kidbuster access key:');
  if(key){
    try{ localStorage.setItem(ACCESS_KEY_STORAGE, key.trim()); }catch(e){ /* storage unavailable */ }
  }
  return key ? key.trim() : null;
}

async function callClaude(systemPrompt, userMessage){
  let accessKey = getStoredAccessKey();
  if(!accessKey){
    accessKey = promptForAccessKey();
    if(!accessKey) throw new Error('An access key is required to generate reports.');
  }

  let response;
  try{
    response = await fetch('/api/generate', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-app-key': accessKey
      },
      body: JSON.stringify({ systemPrompt, userMessage })
    });
  }catch(networkErr){
    throw new Error('Network error — check your connection and try again.');
  }

  if(!response.ok){
    let detail = '';
    try{
      const errBody = await response.json();
      detail = (errBody && errBody.error) || '';
    }catch(e){ /* body wasn't JSON, ignore */ }

    if(response.status === 401){
      try{ localStorage.removeItem(ACCESS_KEY_STORAGE); }catch(e){ /* storage unavailable */ }
      throw new Error('Access key was rejected. Reload the page and re-enter it.');
    }
    if(response.status === 429){
      throw new Error('Rate limited — too many requests too quickly. Wait a moment and try again.');
    }
    if(response.status === 529 || response.status === 503){
      throw new Error('The API is temporarily overloaded. Wait a few seconds and try again.');
    }
    if(response.status >= 500){
      throw new Error('Server error (' + response.status + ').' + (detail ? ' ' + detail : ''));
    }
    throw new Error('Request failed (' + response.status + ').' + (detail ? ' ' + detail : ''));
  }

  const data = await response.json();
  if(!data.text) throw new Error('The server returned an empty response. Try regenerating.');
  return { text: data.text, usage: data.usage || null };
}

// ---------- field-test feedback card ----------
// Lightweight, non-blocking feedback on Kidbuster's output quality — not a
// rating of the student or lesson (that's the existing rating track/tier).
// Deliberately: no modal, not mandatory, submits on a single star click so
// the common case (just tap a star, move on) stays truly one-click. If a
// teacher types a comment first, it's included in that same submission.
const feedbackCard = document.getElementById('feedbackCard');
const feedbackStars = document.getElementById('feedbackStars');
const feedbackComment = document.getElementById('feedbackComment');
const feedbackStatus = document.getElementById('feedbackStatus');
let feedbackContext = null; // { protocol, ratingTier } for the report currently on screen
let feedbackSelectedScore = null;
const feedbackSubmitBtn = document.getElementById('feedbackSubmitBtn');

function showFeedbackCard(protocol, ratingTier){
  feedbackContext = { protocol, ratingTier };
  feedbackSelectedScore = null;
  feedbackComment.value = '';
  feedbackStatus.textContent = '';
  feedbackStatus.className = 'feedback-status';
  feedbackSubmitBtn.disabled = true;
  feedbackStars.querySelectorAll('.feedback-star').forEach(s => s.classList.remove('filled'));
  feedbackCard.style.display = '';
}

function hideFeedbackCard(){
  feedbackCard.style.display = 'none';
  feedbackContext = null;
  feedbackSelectedScore = null;
}

function paintStars(upTo){
  feedbackStars.querySelectorAll('.feedback-star').forEach(s => {
    s.classList.toggle('filled', Number(s.dataset.score) <= upTo);
  });
}

feedbackStars.querySelectorAll('.feedback-star').forEach(starBtn => {
  starBtn.addEventListener('mouseenter', () => {
    paintStars(Number(starBtn.dataset.score));
  });

  // Stars only SELECT a score here — nothing is sent until Submit is
  // pressed. This lets a teacher pick a rating, then still write a
  // comment before anything goes out, instead of firing a request the
  // instant a star is tapped.
  starBtn.addEventListener('click', () => {
    feedbackSelectedScore = Number(starBtn.dataset.score);
    paintStars(feedbackSelectedScore);
    feedbackSubmitBtn.disabled = false;
    feedbackStatus.textContent = '';
    feedbackStatus.className = 'feedback-status';
  });
});

feedbackStars.addEventListener('mouseleave', () => {
  paintStars(feedbackSelectedScore || 0);
});

feedbackSubmitBtn.addEventListener('click', () => {
  if(feedbackSelectedScore){
    submitFeedback(feedbackSelectedScore);
  }
});

async function submitFeedback(score){
  if(!feedbackContext) return;
  feedbackStatus.textContent = 'Sending...';
  feedbackStatus.className = 'feedback-status';
  feedbackSubmitBtn.disabled = true;

  let accessKey = getStoredAccessKey();
  if(!accessKey){
    accessKey = promptForAccessKey();
    if(!accessKey){
      feedbackStatus.textContent = 'Not sent — access key required.';
      feedbackSubmitBtn.disabled = false;
      return;
    }
  }

  const payload = {
    teacherName: (document.getElementById('teacherName').value.trim() || 'Layne'),
    protocol: feedbackContext.protocol,
    ratingTier: feedbackContext.ratingTier,
    score,
    comment: feedbackComment.value.trim()
  };

  try{
    const response = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-app-key': accessKey },
      body: JSON.stringify(payload)
    });
    if(response.ok){
      feedbackStatus.textContent = 'Thanks — feedback sent.';
      feedbackStatus.className = 'feedback-status sent';
    }else{
      feedbackStatus.textContent = 'Could not send feedback. Your report is unaffected.';
      feedbackSubmitBtn.disabled = false;
    }
  }catch(e){
    feedbackStatus.textContent = 'Could not send feedback (network). Your report is unaffected.';
    feedbackSubmitBtn.disabled = false;
  }
}

function flashCopied(){
  copyBtn.classList.add('copied');
  copyBtn.textContent = 'Copied';
  setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.textContent = 'Copy'; }, 1500);
}

// Selects the full output text in the DOM so a manual Ctrl+C / Cmd+C works
// even if no programmatic copy method is available in this environment.
function selectOutputText(){
  try{
    const range = document.createRange();
    range.selectNodeContents(outputBox);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }catch(e){ /* selection not available, nothing more we can do */ }
}

async function copyOutputToClipboard(){
  const text = outputBox.textContent;

  // 1) Modern Clipboard API — works in a normal browser tab, often blocked
  // inside sandboxed preview iframes without clipboard-write permission.
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      flashCopied();
      return true;
    }
  }catch(e){ /* fall through to legacy method */ }

  // 2) Legacy fallback: hidden textarea + execCommand('copy'). This works
  // in many environments where the Clipboard API is blocked, as long as
  // it's called synchronously from a real click (true for the button;
  // best-effort when called automatically after generation).
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){
      flashCopied();
      return true;
    }
  }catch(e){ /* fall through to manual selection */ }

  // 3) Last resort: select the text in place so the person can press
  // Ctrl+C / Cmd+C themselves without hunting for the start/end of it.
  selectOutputText();
  copyBtn.classList.remove('copied');
  copyBtn.textContent = 'Selected — press Ctrl+C';
  setTimeout(() => { copyBtn.textContent = 'Copy'; }, 3000);
  return false;
}

async function generate(){
  const form = readFormState();

  if(!form.notes.trim()){
    outputBox.className = 'output-box error';
    outputBox.textContent = 'Add the Krisp notes for this lesson before generating.';
    return;
  }
  if(!form.rating){
    outputBox.className = 'output-box error';
    outputBox.textContent = 'Select a quality rating before generating.';
    return;
  }

  const protocol = KidbusterCore.PROTOCOLS[form.protocol];

  const cleanedNotes = KidbusterCore.cleanTranscript(form.notes);
  console.log('[Kidbuster] transcript cleaning — raw:', form.notes.length, 'chars → cleaned:', cleanedNotes.length, 'chars');

  const systemPrompt = KidbusterCore.applyTeacherIdentity(
    protocol.buildSystemPrompt({ rating: form.rating, lengthFormat: form.lengthFormat }),
    form.teacherName
  );
  const userMessage = KidbusterCore.buildUserMessage({ ...form, notes: cleanedNotes });

  setLoading(true);
  outputBox.className = 'output-box';
  outputBox.textContent = 'Generating...';
  copyBtn.disabled = true;
  renderLint(null);

  try{
    const { text, usage } = await callClaude(systemPrompt, userMessage);
    if(usage){
      // Real, measured cost from Anthropic's own usage field — not an
      // estimate. claude-sonnet-4-6 standard rate: $3/MTok input, $15/MTok
      // output. Logged per generation so real per-report cost data
      // accumulates from actual usage instead of character-count modeling.
      const inputCost = usage.input_tokens * 3 / 1_000_000;
      const outputCost = usage.output_tokens * 15 / 1_000_000;
      const totalCost = inputCost + outputCost;
      console.log(
        '[Kidbuster cost] protocol=' + form.protocol +
        ' input_tokens=' + usage.input_tokens +
        ' output_tokens=' + usage.output_tokens +
        ' cost=$' + totalCost.toFixed(4) +
        ' report_chars=' + text.trim().length
      );
      recordGeneration(form.protocol, totalCost);
    }else{
      recordGeneration(form.protocol, 0); // report still counts even if usage data wasn't returned
    }
    const lint = protocol.analyze(text, form.rating, form.teacherName, form.lengthFormat);
    setCurrentReport(text, lint);
    outputBox.className = 'output-box';
    outputBox.textContent = text;
    copyBtn.disabled = false;
    newStudentBtn.disabled = false;
    showFeedbackCard(form.protocol, form.rating);
    document.getElementById('actionRow').scrollIntoView({ behavior: 'smooth', block: 'center' });
    renderLint(lint);
    copyOutputToClipboard(); // instant copy — the report is ready to paste the moment it appears
    document.getElementById('krispNotes').value = ''; // clear for the next lesson's transcript
    updateKrispCounter();
    saveDraft();

    // Protocol genuinely finished — show the completion message once, then
    // hold it briefly so it's actually readable before the button resets.
    if(statusCycleTimer){ clearInterval(statusCycleTimer); statusCycleTimer = null; }
    setStatusText(GENERATION_COMPLETE_MESSAGE);
    await new Promise(resolve => setTimeout(resolve, 700));
  }catch(err){
    outputBox.className = 'output-box error';
    outputBox.textContent = 'Could not generate feedback. ' + err.message;
  }finally{
    setLoading(false);
  }
}

generateBtn.addEventListener('click', generate);

// Shared by both "New Student" and "Clear" — resets the workspace to a
// blank slate. The only difference between the two buttons is *when* each
// is enabled: Clear is always available (abandon what you're typing);
// New Student only enables once a report exists (confirm you're done with
// this student and move to the next one).
function resetWorkspace(){
  generateClicksSinceReset = 0; // marks a new lesson boundary for regeneration tracking
  hideFeedbackCard();
  document.getElementById('studentName').value = '';
  document.getElementById('krispNotes').value = '';
  document.getElementById('specialRemarks').value = '';
  updateKrispCounter();
  buildRatingTrack();
  state.currentReportText = null;
  state.currentReportLint = null;
  state.previousReport = null;
  state.viewingPrevious = false;
  updatePrevToggleUI();
  outputBox.className = 'output-box empty';
  outputBox.textContent = 'Protocol standing by.';
  copyBtn.disabled = true;
  newStudentBtn.disabled = true;
  renderLint(null);
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){ /* storage unavailable, fail silently */ }
}

// A deliberately unhurried scroll to the top — native browser smooth-scroll
// is quick and its duration isn't controllable, so this animates it by hand
// with an eased curve for a slower, more dramatic ascent.
function slowScrollToTop(duration){
  const startY = window.scrollY;
  if(startY === 0) return;
  const startTime = performance.now();
  function easeInOutCubic(t){
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  }
  function step(now){
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    window.scrollTo(0, startY * (1 - easeInOutCubic(progress)));
    if(progress < 1){ requestAnimationFrame(step); }
  }
  requestAnimationFrame(step);
}

newStudentBtn.addEventListener('click', () => {
  resetWorkspace();
  slowScrollToTop(1600);
});

document.getElementById('protocolSelect').addEventListener('change', (e) => {
  document.getElementById('protocolBadge').textContent = KidbusterCore.PROTOCOLS[e.target.value].label;
  buildRatingTrack();
});

function updateLengthFormatCaption(){
  const key = (document.querySelector('input[name="lengthFormat"]:checked') || {}).value || 'long';
  const tier = KidbusterCore.LENGTH_TIERS[key] || KidbusterCore.LENGTH_TIERS.long;
  document.getElementById('lengthFormatCaption').textContent =
    'Target ~' + tier.softTarget.toLocaleString() + ' characters (hard ceiling ' + tier.hardCeiling.toLocaleString() + ').';
}
document.getElementById('lengthFormatSelect').addEventListener('change', () => {
  updateLengthFormatCaption();
  saveDraft();
});
updateLengthFormatCaption();

copyBtn.addEventListener('click', copyOutputToClipboard);

clearBtn.addEventListener('click', resetWorkspace);

// ---------- draft persistence (this browser only) ----------
const DRAFT_KEY = 'kidbuster_draft_v1';

// ---------- cumulative usage stats (this browser only) ----------
// Exists specifically to answer a question no per-request cost log can
// answer alone: what's the real relationship between lessons taught and
// reports generated? "generateClicksSinceReset" tracks how many times
// Generate was pressed since the last New Student/Clear — a proxy lesson
// boundary. If that count is already 1+ when a new generation succeeds,
// this was a regeneration of the same lesson, not a new one — evidence
// the reports:lessons ratio can run *above* 1, not just below it.
const USAGE_STATS_KEY = 'kidbuster_usage_stats_v1';
let generateClicksSinceReset = 0;

function loadUsageStats(){
  const defaults = { MA: { reports: 0, cost: 0 }, OF: { reports: 0, cost: 0 }, MS: { reports: 0, cost: 0 }, regenerationEvents: 0 };
  try{
    const raw = localStorage.getItem(USAGE_STATS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      // Merge rather than return parsed directly — protects against stats
      // saved before a protocol (like MS) existed, which would otherwise
      // be missing that key entirely and crash the next recordGeneration.
      return {
        MA: parsed.MA || defaults.MA,
        OF: parsed.OF || defaults.OF,
        MS: parsed.MS || defaults.MS,
        regenerationEvents: parsed.regenerationEvents || 0
      };
    }
  }catch(e){ /* storage unavailable or corrupt, fall through to fresh stats */ }
  return defaults;
}

function recordGeneration(protocolKey, cost){
  const stats = loadUsageStats();
  stats[protocolKey].reports += 1;
  stats[protocolKey].cost += cost;
  if(generateClicksSinceReset >= 1){
    stats.regenerationEvents += 1;
  }
  generateClicksSinceReset += 1;
  try{ localStorage.setItem(USAGE_STATS_KEY, JSON.stringify(stats)); }catch(e){ /* fail silently */ }
}

// Callable from the browser console (F12) at any time: kidbusterStats()
window.kidbusterStats = function(){
  const s = loadUsageStats();
  const totalReports = s.MA.reports + s.OF.reports + s.MS.reports;
  const totalCost = s.MA.cost + s.OF.cost + s.MS.cost;
  console.log('=== Kidbuster cumulative usage (this browser) ===');
  console.log('MA reports:', s.MA.reports, '| MA cost: $' + s.MA.cost.toFixed(4));
  console.log('MA Sweet Voice reports:', s.MS.reports, '| MS cost: $' + s.MS.cost.toFixed(4));
  console.log('OF reports:', s.OF.reports, '| OF cost: $' + s.OF.cost.toFixed(4));
  console.log('Total reports:', totalReports, '| Total cost: $' + totalCost.toFixed(4));
  console.log('MA share:', totalReports ? (s.MA.reports/totalReports*100).toFixed(0)+'%' : 'n/a');
  console.log('MA Sweet Voice share:', totalReports ? (s.MS.reports/totalReports*100).toFixed(0)+'%' : 'n/a');
  console.log('OF share:', totalReports ? (s.OF.reports/totalReports*100).toFixed(0)+'%' : 'n/a');
  console.log('Regeneration events (2nd+ generate before New Student/Clear):', s.regenerationEvents);
  console.log('Avg cost/report:', totalReports ? '$'+(totalCost/totalReports).toFixed(4) : 'n/a');
  return s;
};

function collectDraft(){
  const form = readFormState();
  return {
    rating: state.rating,
    protocol: form.protocol,
    lengthFormat: form.lengthFormat,
    teacherName: form.teacherName,
    studentName: form.studentName,
    krispNotes: form.notes,
    specialRemarks: form.remarks
  };
}

function saveDraft(){
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(collectDraft())); }catch(e){ /* storage unavailable, fail silently */ }
}

function restoreDraft(){
  let draft = null;
  try{ draft = JSON.parse(localStorage.getItem(DRAFT_KEY)); }catch(e){ draft = null; }
  if(!draft) return;

  document.getElementById('teacherName').value = draft.teacherName || 'Layne';
  document.getElementById('studentName').value = draft.studentName || '';
  document.getElementById('krispNotes').value = draft.krispNotes || '';
  document.getElementById('specialRemarks').value = draft.specialRemarks || '';
  updateKrispCounter();

  if(draft.protocol){
    const protocolRadio = document.querySelector('input[name="protocol"][value="' + draft.protocol + '"]');
    if(protocolRadio){
      protocolRadio.checked = true;
      document.getElementById('protocolBadge').textContent = KidbusterCore.PROTOCOLS[draft.protocol].label;
      buildRatingTrack(); // rebuild with the correct button set before restoring the rating below
    }
  }

  if(draft.lengthFormat){
    const lengthRadio = document.querySelector('input[name="lengthFormat"][value="' + draft.lengthFormat + '"]');
    if(lengthRadio) lengthRadio.checked = true;
  }
  updateLengthFormatCaption();

  if(draft.rating){
    const btn = track.querySelector('button[data-lvl="'+draft.rating+'"]');
    if(btn) btn.click();
  }
}

restoreDraft();
</script>
